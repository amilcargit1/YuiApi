services:
  - type: web
    name: yuiapi
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yuiapi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://yuiapi-4sbx.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
databases:
  - name: yuiapi-db
    plan: free
