services:
  - type: web
    name: yuiapi
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: APP_NAME
        value: YuiAPI
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yuiapi-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_FREE_DAILY
        value: 100
      - key: RATE_LIMIT_DEVELOPER_DAILY
        value: 5000
      - key: RATE_LIMIT_PRO_DAILY
        value: 50000
      - key: RATE_LIMIT_ENTERPRISE_DAILY
        value: 1000000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: yuiapi-db
    plan: free
    region: oregon
    databaseName: yuiapi
    user: yuiapi
